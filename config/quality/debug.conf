#VERBOSE 是 Gunyah hypervisor 构建系统里的一个编译期调试开关，用来开启更严格的运行时自检与调试辅助代码。
configs VERBOSE=1 
configs VERBOSE_TRACE=1
configs RESET_ON_ABORT=0
configs HYP_QUALITY="debug"
configs ROOTVM_ALWAYS_ON_BOOT_CORE=1
flags -O1 -g -mstrict-align -fsanitize=undefined -fsanitize-trap=undefined

#include include/debug_no_kaslr
include include/debug_no_cspace_rand
include include/debug_no_rootvm_aslr
